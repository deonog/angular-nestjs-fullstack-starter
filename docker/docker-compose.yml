# ------------------------------------------------------------------------------
# Host ports (what you open in the browser / DB tools):
#
#   3001 — NestJS API (`npm run dev` starts this). Frontend calls `http://localhost:3001`.
#          (3000 is used by workout-fullstack-app on the same machine.)
#
#   5433 — PostgreSQL (Docker `supabase-db`). Use from pgAdmin, psql, or DATABASE_URL when
#          using compose only. Supabase CLI DB is on 54422 — see supabase/config.toml.
#
#   4200 — Angular UI built in Docker (`ng build` + nginx). Open http://localhost:4200
#          For hot reload on the host instead: `npm run dev:frontend` (stop Docker frontend first).
#
# `npm run dev` — backend + Postgres + frontend (all via Docker).
# ------------------------------------------------------------------------------
name: angular-nestjs-fullstack-start
services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "3000:3000"
    # env_file:
    #   - ../.env
    # .env may set PORT=3001 for local (non-Docker) runs; inside the container the app must listen on 3000
    # to match the right-hand side of "3001:3000" above.
    environment:
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Built SPA (`ng build` in frontend.Dockerfile) + nginx. Rebuild with `docker compose up --build`.
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
