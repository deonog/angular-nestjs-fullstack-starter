<div class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-4">
  <div class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-medium uppercase tracking-wide text-slate-500">Dashboard</p>
    <h1 class="mt-2 text-3xl font-semibold text-slate-900">Welcome back</h1>

    @if (user(); as currentUser) {
      <p class="mt-4 text-slate-600">
        Signed in as <span class="font-medium text-slate-900">{{ currentUser.email }}</span>
      </p>
    }

    <button
      type="button"
      class="mt-6 rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-900 hover:bg-slate-50"
      (click)="logout()"
    >
      Sign out
    </button>
  </div>
</div>
